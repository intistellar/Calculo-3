name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Run tests
      run: |
        python -m pytest surfacelab/tests/ -v --tb=short
    
    - name: Run vector calculus tests
      run: |
        python -m pytest surfacelab/tests/test_vector_calculus.py -v --tb=short
    
    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          surfacelab/tests/*.py